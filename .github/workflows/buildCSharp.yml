name: Windows C# SDK validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild and test Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86]
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Conan dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install 'conan>=2,<3'
          conan profile detect --force
          conan remote remove conancenter
          conan remote add nrel-v2 https://conan.openstudio.net/artifactory/api/conan/conan-v2
          conan remote add conancenter https://center2.conan.io
          $extra = @()
          if ('${{ matrix.arch }}' -eq 'x86') {
            $extra += @('-c', 'antlr4-cppruntime/*:tools.build:cxxflags+=/FIchrono')
          }
          conan install . --output-folder=build --build=missing --lockfile-partial `
            -c tools.cmake.cmaketoolchain:generator=Ninja `
            -s:b arch=x86_64 -s:h arch=${{ matrix.arch }} `
            -s compiler.cppstd=20 -s build_type=Release `
            -o with_testing=True -o with_benchmark=False `
            -o with_ruby=False -o with_python=False -o with_csharp=True @extra
      - name: Configure OpenStudio
        shell: cmd
        run: |
          call build\conanbuild.bat || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="%CD%/build/conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DBUILD_CSHARP_BINDINGS=ON -DBUILD_TESTING=ON -DBUILD_NUGET_PACKAGE=OFF -DBUILD_PYTHON_BINDINGS=OFF -DBUILD_RUBY_BINDINGS=OFF -DBUILD_CLI=OFF
      - name: Rebuild native libraries and managed bindings
        shell: cmd
        run: |
          call build\conanbuild.bat || exit /b 1
          cmake --build build --config Release --target csharp_sdk --parallel 4
      - name: Run the registered Windows regression
        shell: cmd
        run: |
          call build\conanrun.bat || exit /b 1
          ctest --test-dir build -C Release -R "^CSharpTest-Utf8Bindings$" --no-tests=error --output-on-failure
      - name: Stage SDK binaries and test artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path validation/net45,validation/netstandard2.0 -Force | Out-Null
          foreach ($name in @('openstudiolib.dll', 'openstudio_csharp.dll', 'openstudio_model_csharp.dll', 'openstudio_translators_csharp.dll')) {
            Copy-Item "build/Products/$name" validation/net45
            Copy-Item "build/Products/$name" validation/netstandard2.0
          }
          Copy-Item build/Products/csharp/Release/NET45/OpenStudio.dll validation/net45
          Copy-Item build/Products/csharp/Release/netstandard2.0/OpenStudio.dll validation/netstandard2.0
          Copy-Item build/csharp_utf8_test/Release/Utf8Bindings.exe validation/net45
          Copy-Item build/csharp_utf8_test/Release/Utf8Bindings.exe validation/netstandard2.0
          Copy-Item build/Testing/Temporary/LastTest.log validation
          git rev-parse HEAD | Set-Content validation/source-commit.txt
      - name: Test the netstandard build on .NET 10
        if: matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $config = '{"runtimeOptions":{"tfm":"net10.0","framework":{"name":"Microsoft.NETCore.App","version":"10.0.0"}}}'
          Set-Content validation/netstandard2.0/Utf8Bindings.runtimeconfig.json $config -Encoding utf8NoBOM
          dotnet validation/netstandard2.0/Utf8Bindings.exe | Tee-Object validation/net10-test.log
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-csharp-${{ matrix.arch }}-${{ github.sha }}
          path: |
            validation/
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
